services:
  postgres:
    image: postgres:16-alpine
    container_name: oficinapro-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: oficinapro
      POSTGRES_PASSWORD: oficinapro
      POSTGRES_DB: oficinapro
    ports:
      - "5433:5432"
    volumes:
      - oficinapro-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oficinapro -d oficinapro"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  oficinapro-data: