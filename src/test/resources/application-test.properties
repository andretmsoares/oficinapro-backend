spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop

spring.flyway.enabled=false

# Segredo fixo apenas para testes (>= 32 caracteres, exigencia do HS256).
oficinapro.jwt.secret=segredo-exclusivo-de-testes-com-mais-de-32-bytes
oficinapro.jwt.issuer=oficinapro-test
oficinapro.jwt.expiration=8h

# Vazio para o AdminSeeder nao rodar nos testes.
oficinapro.admin.username=
oficinapro.admin.password=
