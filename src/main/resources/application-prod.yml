spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false

logging:
  level:
    root: WARN
    com.oficinapro: INFO
    org.hibernate.SQL: WARN
    org.flywaydb: INFO

server:
  port: ${SERVER_PORT:8080}