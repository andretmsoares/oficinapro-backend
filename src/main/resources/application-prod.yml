spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false

logging:
  level:
    root: WARN
    com.oficinapro: INFO
    org.hibernate.SQL: WARN
    org.flywaydb: INFO

server:
  port: ${SERVER_PORT:8080}

# Documentação interativa e health detalhado ficam fechados em produção.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoint:
    health:
      show-details: never
