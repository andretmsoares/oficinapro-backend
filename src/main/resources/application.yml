spring:
  application:
    name: oficinapro

  profiles:
    default: dev

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: America/Sao_Paulo

  flyway:
    enabled: true
    baseline-on-migrate: false

  # Upload da logo da oficina (limite de negocio: 2 MB, validado tambem no service).
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

oficinapro:
  jwt:
    # Default vazio apenas para que a falha venha do JwtConfig,
    # com mensagem explicando o que fazer, em vez de um erro
    # cru de placeholder não resolvido.
    # Precisa ter no mínimo 32 caracteres (exigência do HS256).
    secret: ${JWT_SECRET:}
    issuer: oficinapro
    expiration: 8h

  # Cria o ADMIN do SaaS na primeira subida, caso ainda não exista nenhum.
  # Se as variáveis não forem definidas, o seeder simplesmente não roda.
  admin:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
    nome: ${ADMIN_NOME:Administrador do SaaS}

  # Logo da oficina nos PDFs. Sem bucket, o upload fica desabilitado (503) e os PDFs usam
  # a logo padrao do sistema. Credenciais: ADC (service account anexada ao servico no GCP ou
  # GOOGLE_APPLICATION_CREDENTIALS apontando para o JSON da chave).
  storage:
    gcs:
      bucket: ${GCS_BUCKET:}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html