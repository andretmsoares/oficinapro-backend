spring:
  application:
    name: oficinapro

  # Sem "profiles.default": quem sobe a aplicação escolhe o profile (SPRING_PROFILES_ACTIVE).
  # Antes o padrão era "dev", e uma produção sem o profile definido logava SQL e parâmetros
  # (hashes de senha, CPF, telefone). Sem profile, vale só esta configuração, que é quieta.

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: America/Sao_Paulo

  flyway:
    enabled: true
    baseline-on-migrate: false

  # Upload da logo da oficina (limite de negocio: 2 MB, validado tambem no service).
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

oficinapro:
  jwt:
    # Default vazio apenas para que a falha venha do JwtConfig,
    # com mensagem explicando o que fazer, em vez de um erro
    # cru de placeholder não resolvido.
    # Precisa ter no mínimo 32 caracteres (exigência do HS256).
    secret: ${JWT_SECRET:}
    issuer: oficinapro
    expiration: 8h

  security:
    # true SOMENTE quando a API não é alcançável diretamente (atrás do túnel Cloudflare, sem
    # porta publicada): só então CF-Connecting-IP / X-Forwarded-For são confiáveis. Com a API
    # exposta, um cliente forjaria o header para escapar do limite de tentativas de login.
    trust-proxy-headers: ${TRUST_PROXY_HEADERS:false}
    # Tamanho máximo do corpo das requisições que não são upload (padrão 1 MB).
    max-json-body-bytes: 1048576

  # Proteção do login (por IP; ver LoginThrottleService).
  login:
    tentativas-por-bloqueio: 5
    janela-falhas: 15m
    duracao-bloqueio: 15m
    max-tentativas-por-ip: 30
    janela-ip: 5m

  # Cria o ADMIN do SaaS na primeira subida, caso ainda não exista nenhum.
  # Se as variáveis não forem definidas, o seeder simplesmente não roda.
  admin:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
    nome: ${ADMIN_NOME:Administrador do SaaS}

  # Logo da oficina nos PDFs. Sem bucket, o upload fica desabilitado (503) e os PDFs usam
  # a logo padrao do sistema. Credenciais: ADC (service account anexada ao servico no GCP ou
  # GOOGLE_APPLICATION_CREDENTIALS apontando para o JSON da chave).
  storage:
    gcs:
      bucket: ${GCS_BUCKET:}
    # Cloudflare R2 (API S3). Se R2_BUCKET estiver definido, tem prioridade sobre o GCS.
    r2:
      bucket: ${R2_BUCKET:}
      endpoint: ${R2_ENDPOINT:}
      access-key: ${R2_ACCESS_KEY:}
      secret-key: ${R2_SECRET_KEY:}

logging:
  level:
    # Este resolver registra, em WARN, o caminho de cada requisição para rota inexistente
    # ("No static resource ..."). Se um cliente errar e puser um CPF numa URL, ele iria parar no
    # log (e bots de varredura inundariam o log). O 404 já é tratado pelo GlobalExceptionHandler.
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: ERROR

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  tomcat:
    max-swallow-size: 2MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html