services:

  postgres:
    image: postgres:16-alpine
    container_name: oficinapro-db
    restart: unless-stopped
    env_file:
      - ./../../.env
    ports:
      # Só loopback: a senha de dev é fraca e este banco não deve ser visto por outras máquinas.
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - oficinapro-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: eclipse-temurin:21-jdk
    container_name: oficinapro-app
    working_dir: /app
    volumes:
      - ../..:/app
      - gradle_cache:/root/.gradle
    env_file:
      - ./../../.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      # Sem profile a aplicação sobe quieta; "dev" liga o log de SQL/debug (nunca use em produção).
      SPRING_PROFILES_ACTIVE: dev
    command: ./gradlew bootRun --no-daemon
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  oficinapro-data:
  gradle_cache:

