services:
  postgres:
    image: postgres:16-alpine
    container_name: oficinapro-db
    restart: unless-stopped
    env_file:
      - ./../../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - oficinapro-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: ${DOCKER_USERNAME}/oficinapro-backend:latest
    container_name: oficinapro-app
    restart: unless-stopped
    env_file:
      - ./../../.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: ${DOCKER_USERNAME}/oficinapro-frontend:latest
    container_name: oficinapro-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - app

volumes:
  oficinapro-data: