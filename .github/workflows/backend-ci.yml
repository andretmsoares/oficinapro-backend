name: Backend CI

on:
  pull_request:
    branches:
      - develop
      - main

# Menor privilégio para o GITHUB_TOKEN: o CI só precisa ler o repositório.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Give execute permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Run checks, tests and coverage
        run: ./gradlew clean check

      - name: Build application
        run: ./gradlew bootJar
